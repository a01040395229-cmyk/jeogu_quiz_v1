<!DOCTYPE html>
<html lang="ko">
<head>
    <style>html, body { background-color: #000 !important; }</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StanbyME</title>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; /* Letterbox background */
            overflow: hidden;
            touch-action: none; /* Prevent default touch actions like scrolling */
        }

        .screen-container {
            position: relative;
            width: 1080px;
            height: 1920px;
            /* 기존 배경의 하늘색 그라데이션 복원 */
            background: linear-gradient(to bottom, #63C8FF 0%, #C5EBFF 34%); 
            overflow: hidden;
            transform-origin: center center;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('asset/background 1.svg');
            background-size: cover;
            background-position: center;
            z-index: 2; /* 구름(1)보다 앞쪽에 배치되어 잔디와 로고가 구름을 가림 */
            clip-path: inset(58.7% 0 0 0); /* 로고 삭제 */
        }


        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* 버튼 외 영역 터치 무시 */
        }

        .jeogu {
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            top: 50.5%;
            width: 799px;
            height: 348px;
            z-index: 10;
            transform-origin: bottom center;
            pointer-events: none;
            will-change: transform;
        }
        .jeogu svg, .jeogu img {
            pointer-events: auto;
            transform-origin: bottom center;
            animation: breathe 2.5s infinite ease-in-out;
            will-change: transform;
        }

        .jeogu.typing-active {
            animation: jumpMargin 0.7s forwards;
        }

        .jeogu.typing-inactive {
            animation: jumpMarginReverse 0.6s forwards;
        }

        @keyframes jumpMargin {
            0% { transform: translateX(-50%) translateY(0); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
            45% { transform: translateX(-50%) translateY(-320px); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
            75% { transform: translateX(-50%) translateY(-198px); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
            88% { transform: translateX(-50%) translateY(-220px); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
            100% { transform: translateX(-50%) translateY(-198px); }
        }

        @keyframes jumpMarginReverse {
            0% { transform: translateX(-50%) translateY(-198px); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
            40% { transform: translateX(-50%) translateY(-300px); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
            80% { transform: translateX(-50%) translateY(0); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
            90% { transform: translateX(-50%) translateY(-30px); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
            100% { transform: translateX(-50%) translateY(0); }
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1, 1);
            }
            50% {
                transform: scale(1.02, 1.04);
            }
        }

        .pupil {
            transform-origin: center;
            /* JS의 requestAnimationFrame으로 부드럽게 제어하므로 transition 제거 */
        }

        .road-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            width: 200px;
            height: 943px;
            perspective: 250px; /* 3D 공간 깊이감 부여 */
            perspective-origin: 50% 0%; /* 소실점을 맨 위쪽(저구 밑)으로 설정 */
            z-index: 1;
            overflow: hidden; /* 위로 벗어나지 않게 */
        }

        .road-line-css {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 69px; /* 기존 에셋 이미지의 최대 두께(69px)와 동일하게 맞춤 */
            height: 3000px;
            transform-origin: bottom center;
            transform: translateX(-50%) rotateX(60deg);
            background-image: linear-gradient(to bottom, #ffffff 50%, transparent 50%);
            background-size: 100% 240px; /* 기존 에셋의 점선 길이와 유사하게 (3D 압축 감안) */
            animation: moveRoadCSS 0.8s infinite linear; 
        }

        .road-line-css.fast {
            animation-duration: 0.25s;
        }

        @keyframes moveRoadCSS {
            0% {
                background-position-y: 0px;
            }
            100% {
                background-position-y: 240px;
            }
        }

        .sky-container {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 50.5%; /* 하늘 영역 */
            z-index: 1; /* background(2)보다 뒤에 위치 */
            overflow: visible; /* 잔디가 가려주므로 가리지 않아도 됨 */
        }

        .cloud {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            transform-origin: center center;
            animation-timing-function: ease-in; /* 다가올수록 빨라지는 원근감 */
            will-change: transform, opacity;
        }

        .cloud1 {
            width: 300px;
            height: 150px;
            background-image: url('asset/cloud1.svg');
            animation: moveCloudLeft 8s infinite ease-in;
            left: 0;
            top: 0;
        }

        .cloud1.fast {
            animation-duration: 2s;
        }

        .cloud2 {
            width: 250px;
            height: 125px;
            background-image: url('asset/cloud2.svg');
            animation: moveCloudRight 7s infinite ease-in;
            animation-delay: -3.5s;
            left: 0;
            top: 0;
        }

        .cloud2.fast {
            animation-duration: 1.75s;
            animation-delay: -0.875s;
        }

        /* 공통: 소실점을 벗어나 좌우 지평선에서 시작하도록 수정 */
        @keyframes moveCloudLeft {
            0% { transform: translate(calc(30vw - 50%), calc(53vh - 50%)) scale(1.5); opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translate(calc(-30vw - 50%), calc(30.3vh - 50%)) scale(12); opacity: 0; }
        }

        @keyframes moveCloudRight {
            0% { transform: translate(calc(70vw - 50%), calc(53vh - 50%)) scale(1.2); opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translate(calc(130vw - 50%), calc(35.35vh - 50%)) scale(14); opacity: 0; }
        }

        .airplane-container {
            position: absolute;
            top: 0;
            right: 0;
            width: 186px;
            height: 140px;
            animation: flyAcross 6s infinite linear;
            z-index: 2;
            will-change: transform;
        }

        @keyframes flyAcross {
            0% { transform: translate(30vw, 65vh); }
            100% { transform: translate(-130vw, 65vh); }
        }

        .airplane {
            position: absolute;
            top: 0;
            left: 0;
            width: 186px;
            height: 140px;
            background-image: url('asset/bg-icon2.svg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        .falling-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 83px;
            height: 60px;
            background-image: url('asset/bg-icon3-1.svg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            animation: dropAnimation 6s infinite;
            will-change: transform, opacity;
        }

        @keyframes dropAnimation {
            0%, 55% { opacity: 0; transform: translate(35px, 60vh) rotate(0deg); }
            55.1% { opacity: 1; transform: translate(35px, 60vh) rotate(0deg); animation-timing-function: ease-in; }
            75% { opacity: 1; transform: translate(35px, 500vh) rotate(-360deg); }
            75.1%, 100% { opacity: 0; transform: translate(35px, 500vh) rotate(-360deg); }
        }

        .pop-icon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; /* 두 번째 페이지에서만 표시 */
        }

        .pop-icon4 {
            position: absolute;
            top: 0;
            left: 0;
            width: 137px; /* bg-icon4 원본 사이즈 */
            height: 137px;
            background-image: url('asset/bg-icon4.svg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            will-change: transform, opacity;
        }

        .pop-icon5 {
            position: absolute;
            top: 0;
            right: 0;
            width: 157px; /* bg-icon5 원본 사이즈 */
            height: 157px;
            background-image: url('asset/bg-icon5.svg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            will-change: transform, opacity;
        }

        .pop-icon4.animate {
            animation: popAndDropLeft 6s infinite;
        }

        .pop-icon5.animate {
            animation: popAndDropRight 6s infinite;
        }

        @keyframes popAndDropLeft {
            0%, 5% { transform: translate(-150px, 60vh) rotate(-90deg); opacity: 0; }
            6% { opacity: 1; transform: translate(-100px, 60vh) rotate(-90deg); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
            20% { transform: translate(15vw, 50vh) rotate(45deg); animation-timing-function: cubic-bezier(0.5, 0, 1, 1); }
            55% { transform: translate(35vw, 150vh) rotate(270deg); opacity: 1; }
            56%, 100% { transform: translate(35vw, 150vh) rotate(270deg); opacity: 0; }
        }

        @keyframes popAndDropRight {
            0%, 5% { transform: translate(170px, 75vh) rotate(90deg); opacity: 0; }
            6% { opacity: 1; transform: translate(100px, 75vh) rotate(90deg); animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }
            20% { transform: translate(-15vw, 45vh) rotate(-45deg); animation-timing-function: cubic-bezier(0.5, 0, 1, 1); }
            45% { transform: translate(-25vw, 150vh) rotate(-270deg); opacity: 1; }
            46%, 100% { transform: translate(-25vw, 150vh) rotate(-270deg); opacity: 0; }
        }

        .bt-start {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 78.1%;
            width: 545px;
            height: 175px;
            background-image: url('asset/bt-start.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s;
            z-index: 20;
        }

        .bt-start:active {
            transform: translateX(-50%) scale(0.95);
        }

        .bt-name {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 78.1%;
            width: 724px;
            height: 175px;
            background-image: url('asset/bt-name.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none; /* 처음에는 숨김 */
            pointer-events: auto;
            border: none;
            background-color: transparent;
            font-family: 'Pretendard', sans-serif;
            font-weight: 600; /* SemiBold */
            font-size: 38pt;
            text-align: center;
            box-sizing: border-box;
            padding-bottom: 18px; /* 버튼 아래쪽 그림자 영역만큼 패딩을 주어 텍스트를 위로 밀어올림 */
            line-height: 157px; /* 175px - 18px */
            margin: 0;
            color: #0F1811;
            outline: none;
            z-index: 20;
            transition: top 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.5s, height 0.5s, font-size 0.5s;
        }

        .bt-name.typing-active {
            top: 25%;
            width: 845px;
            height: 233px;
            background-image: url('asset/rect-name.svg');
            font-size: 65pt;
            line-height: 233px;
            padding-bottom: 0;
        }

        .bt-name::placeholder {
            color: #797979;
            transition: color 0.2s;
        }

        .bt-name:focus::placeholder {
            color: transparent; /* 클릭 시 문구 사라짐 */
        }

        .sign-bubble {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -5px; /* 이미지 픽셀 매칭: 바닥선에 다리가 위치함 */
            width: 748px;
            height: 516px;
            background-image: url('asset/sign-bubble.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none; /* 처음엔 숨김 */
            z-index: 25; /* 입력창이나 다른 UI보다 앞에 표시 */
            pointer-events: none;
            animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .sign-bubble .user-name {
            position: absolute;
            top: 165px; /* 보드판 정중앙 */
            left: 50%;
            width: 85%; /* 텍스트 양옆 여백 보장 */
            text-align: center;
            transform: translate(-50%, -50%);
            font-family: 'Pretendard', sans-serif;
            font-weight: 600; /* SemiBold */
            font-size: 38pt;
            color: #0F1811;
            word-break: keep-all; /* 단어가 다 끝나면 줄바꿈 */
            line-height: 1.4;
        }

        .progress-bar {
            position: absolute;
            top: 260px; /* 좌우 여백보다 훨씬 넓은 상단 여백 (약 260px) 반영 */
            left: 50%;
            transform: translateX(-50%);
            width: 919px;
            height: 36px;
            background-image: url('asset/bar-3.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none; /* 처음에 숨김 */
            z-index: 30;
        }

        @keyframes popup {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        .warning-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('asset/rect-warning.svg');
            background-size: cover;
            background-position: center;
            z-index: 20; /* 표지판(25) 뒤, 저구(10) 앞 */
            pointer-events: none;
            display: none;
            animation: flashWarning 0.4s infinite alternate;
        }

        @keyframes flashWarning {
            0% { opacity: 0; }
            100% { opacity: 0.8; } /* 너무 눈아프지 않게 최대 투명도 조절 */
        }

        .siren {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 400px; /* 저구 머리 위 허공에 띄움 */
            width: 250px;
            height: 358px;
            display: none;
            z-index: 12; /* 저구보다 위 */
            background-image: url('asset/alarm-1.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: toggleSiren 0.5s infinite steps(1); /* 0.5초마다 교체 */
        }

        @keyframes toggleSiren {
            0% { background-image: url('asset/alarm-1.svg'); }
            50% { background-image: url('asset/alarm-2.svg'); }
            100% { background-image: url('asset/alarm-1.svg'); }
        }



        .rect-darkpt {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 55%; /* 저구 캐릭터 위쪽 위치 하향 */
            width: 747px;
            height: 250px;
            background-image: url('asset/rect-darkpt.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none;
            z-index: 15;
        }

        /* 퀴즈 화면 전환 애니메이션 추가 스타일 */
        .green-wipe-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2300px;
            height: 2300px;
            z-index: 48; /* 저구 앞으로 오도록 z-index 수정 */
            display: none;
            pointer-events: none;
        }

        .green-wipe-svg.active circle {
            animation: wipeFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes wipeFill {
            from { stroke-dashoffset: 3613; }
            to { stroke-dashoffset: 0; }
        }

        .big-jeogu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.3); /* 애니메이션 최종 위치와 맞춤 */
            width: 1800px;
            z-index: 45;
            display: none;
        }

        .big-jeogu.zoom-in-big {
            animation: bigJeoguZoom 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            transform-origin: center center;
        }

        @keyframes bigJeoguZoom {
            0% { transform: translate(-50%, -50%) scale(0.3); }
            100% { transform: translate(-50%, -50%) scale(1.3); } /* 화면 중앙에서 커지도록 중심축 수정 */
        }

        .quiz-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #35D047;
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 화면 중앙 정렬 */
            opacity: 0;
            transition: opacity 0.5s;
        }

        .quiz-screen.active {
            display: flex;
            opacity: 1;
        }

        .quiz-eyes {
            width: 320px;
            height: 130px;
            margin-bottom: 250px; /* 텍스트와의 간격 */
        }

        .quiz-text {
            text-align: center;
            font-family: 'Pretendard', sans-serif;
            color: #0F1811;
        }

        .quiz-text h1 {
            font-size: 120pt;
            font-weight: 800; /* ExtraBold */
            margin: 0;
            letter-spacing: -3px;
        }

        .quiz-text p {
            font-size: 70pt;
            font-weight: 700; /* Bold */
            margin: 30px 0 0 0;
            line-height: 1.25;
            letter-spacing: -2px;
        }

        /* 타이핑 시 나타나는 상단 UI */
        .typing-top-ui {
            position: absolute;
            top: 260px; /* 원래 진행바(bar-2) 위치와 동일하게 수정 */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 20;
            pointer-events: none;
        }

        .typing-top-ui.show {
            opacity: 1;
        }

        .typing-top-ui .bar-1 {
            width: 908px;
            height: 13px;
            background-image: url('asset/bar-3.svg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .max-chars-label {
            position: absolute;
            top: 400px; /* 이름 입력창(top: 480px) 바로 위에 배치 */
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Pretendard', sans-serif;
            font-size: 34pt;
            color: #ffffff;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 20;
            pointer-events: none;
        }

        .max-chars-label.show {
            opacity: 1;
        }

        /* 커스텀 가상 키보드 UI (애플 스타일) */
        .mock-keyboard {
            position: absolute;
            bottom: -800px;
            left: 0;
            width: 100%;
            height: 800px;
            background-color: #d1d5dc;
            z-index: 100;
            transition: bottom 0.4s cubic-bezier(0.2, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 30px 15px 50px 15px;
            box-sizing: border-box;
            gap: 20px;
            pointer-events: auto;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }

        .mock-keyboard.show {
            bottom: 0;
        }

        .mock-key-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .mock-key {
            background-color: #ffffff;
            border-radius: 12px;
            flex: 1;
            box-shadow: 0 4px 0 #a2a8b0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45pt;
            font-family: 'Pretendard', sans-serif;
            font-weight: 500;
            color: #000;
            user-select: none;
            cursor: pointer;
            height: 110px;
        }

        .mock-key.special {
            background-color: #acb3bd;
            box-shadow: 0 4px 0 #899099;
            font-size: 36pt;
        }

        .mock-key:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #a2a8b0;
        }

        .mock-key.special:active {
            box-shadow: 0 0px 0 #899099;
        }

        .mock-key svg {
            width: 55px;
            height: 55px;
            fill: none;
            stroke: #000;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .keyboard-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            margin-top: 15px;
        }

        .keyboard-footer svg {
            width: 60px;

    <script>
        // 화면 크기에 맞게 1080x1920 캔버스 스케일링
        function resizeCanvas() {
            const container = document.querySelector('.screen-container');
            const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
            container.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const btnStart = document.getElementById('btnStart');
        const btnName = document.getElementById('btnName');
        const signBubble = document.getElementById('signBubble');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const backgroundEl = document.querySelector('.background');
        const progressBar = document.getElementById('progressBar');
        const jeoguSvg1 = document.getElementById('jeogu-svg-1');
        const jeoguImg2 = document.getElementById('jeogu-img-2');
        const jeoguImg3 = document.getElementById('jeogu-img-3');
        const warningOverlay = document.getElementById('warningOverlay');
        const siren = document.getElementById('siren');
        const greenWipe = document.getElementById('greenWipe');
        const quizScreen = document.getElementById('quizScreen');
        const bigJeogu1 = document.getElementById('bigJeogu1');
        const bigJeogu2 = document.getElementById('bigJeogu2');
        const roadLineCss = document.querySelector('.road-line-css');
        const cloud1 = document.querySelector('.cloud1');
        const cloud2 = document.querySelector('.cloud2');
        const mockKeyboard = document.getElementById('mockKeyboard');
        const typingTopUi = document.getElementById('typingTopUi');
        const maxCharsLabel = document.getElementById('maxCharsLabel');

        const isMobileDevice = /Mobi|Android|WebOS|iPhone|iPad|iPod/i.test(navigator.userAgent) || navigator.maxTouchPoints > 0;

        const showKeyboard = () => {
            if (!isMobileDevice) {
                mockKeyboard.classList.add('show');
            }
            jeoguEl.classList.remove('typing-inactive');
            jeoguEl.classList.add('typing-active');
            btnName.classList.add('typing-active');
            typingTopUi.classList.add('show');
            maxCharsLabel.classList.add('show');
        };

        const hideKeyboard = () => {
            if (!isMobileDevice) {
                mockKeyboard.classList.remove('show');
            }
            jeoguEl.classList.remove('typing-active');
            jeoguEl.classList.add('typing-inactive');
            btnName.classList.remove('typing-active');
            typingTopUi.classList.remove('show');
            maxCharsLabel.classList.remove('show');
        };

        // 클릭 시 키보드가 뜨도록 설정 (포커스는 기본 동작으로 처리됨)
        btnName.addEventListener('focus', showKeyboard);
        btnName.addEventListener('click', showKeyboard);
        
        // 화면의 다른 부분을 클릭하면 키보드 숨기기
        const handleOutsideClick = (e) => {
            if (btnName.style.display === 'block' && (mockKeyboard.classList.contains('show') || isMobileDevice) && !mockKeyboard.contains(e.target) && e.target !== btnName) {
                hideKeyboard();
                // 포커스 해제
                btnName.blur();
            }
        };
        window.addEventListener('mousedown', handleOutsideClick);
        window.addEventListener('touchstart', handleOutsideClick);

        // 엔터키 입력 시 이름 제출 (노트북 등 실제 키보드 대응)
        btnName.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                hideKeyboard();
                submitName();
            }
        });

        // 가상 키보드 레이아웃 데이터
        const layoutKR = [
            ['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],
            ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
            ['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']
        ];
        const layoutKRShift = [
            ['ㅃ','ㅉ','ㄸ','ㄲ','ㅆ','ㅛ','ㅕ','ㅑ','ㅒ','ㅖ'],
            ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
            ['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']
        ];
        const layoutEN = [
            ['q','w','e','r','t','y','u','i','o','p'],
            ['a','s','d','f','g','h','j','k','l'],
            ['z','x','c','v','b','n','m']
        ];
        const layoutENShift = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['Z','X','C','V','B','N','M']
        ];
        const layoutNum = [
            ['1','2','3','4','5','6','7','8','9','0'],
            ['-','/',':',';','(',')','$','&','@','"'],
            ['.','\,','?','!','\'']
        ];

        let currentLang = 'KR'; // 'KR', 'EN', 'NUM'
        let isShift = false;

        const updateKeyboardDisplay = () => {
            const keys = document.querySelectorAll('.letter-key');
            let layout;
            if (currentLang === 'KR') layout = isShift ? layoutKRShift : layoutKR;
            else if (currentLang === 'EN') layout = isShift ? layoutENShift : layoutEN;
            else layout = layoutNum;

            keys.forEach(key => {
                const r = parseInt(key.getAttribute('data-row'));
                const c = parseInt(key.getAttribute('data-col'));
                if (layout[r] && layout[r][c]) {
                    key.innerText = layout[r][c];
                    key.style.visibility = 'visible';
                } else {
                    key.style.visibility = 'hidden';
                }
            });
            document.getElementById('btnNum').innerText = currentLang === 'NUM' ? (isShift ? '가나다' : 'ABC') : '123';
        };

        const handleLangClick = (e) => {
            e.preventDefault();
            if (btnName.style.display !== 'block') return;
            if (currentLang === 'KR') currentLang = 'EN';
            else if (currentLang === 'EN') currentLang = 'KR';
            else currentLang = 'KR';
            isShift = false;
            updateKeyboardDisplay();
        };

        const btnLang = document.getElementById('btnLang');
        btnLang.addEventListener('mousedown', handleLangClick);
        btnLang.addEventListener('touchstart', handleLangClick);

        // 가상 키보드 입력 로직 (Hangul.js 연동)
        const mockKeys = document.querySelectorAll('.mock-key');
        mockKeys.forEach(key => {
            const handleKeyClick = (e) => {
                e.preventDefault(); // 입력창 포커스 잃지 않게 방지
                if (btnName.style.display !== 'block') return;
                
                const keyType = key.getAttribute('data-key');
                const keyText = key.innerText.trim();

                if (keyType === 'shift') {
                    isShift = !isShift;
                    updateKeyboardDisplay();
                    return;
                }
                
                if (keyType === 'num') {
                    if (currentLang === 'NUM') {
                        currentLang = isShift ? 'EN' : 'KR';
                    } else {
                        currentLang = 'NUM';
                    }
                    isShift = false;
                    updateKeyboardDisplay();
                    return;
                }

                if (!window.Hangul) return; // 라이브러리 로드 대기

                let typedChars = window.Hangul.disassemble(btnName.value);

                if (keyType === 'backspace') {
                    typedChars.pop();
                } else if (keyType === 'space') {
                    typedChars.push(' ');
                } else if (keyType === 'enter') {
                    hideKeyboard();
                    submitName();
                    return;
                } else if (key.classList.contains('letter-key')) {
                    typedChars.push(keyText);
                    // 한 번 입력 후 쉬프트 해제 (숫자기호 제외)
                    if (isShift && currentLang !== 'NUM') {
                        isShift = false;
                        updateKeyboardDisplay();
                    }
                }

                // Hangul.assemble로 조합된 문자열 생성
                const assembled = window.Hangul.assemble(typedChars);
                if (assembled.length <= 5) {
                    btnName.value = assembled;
                } else {
                    // 5글자 초과 시 마지막 입력 취소
                    const truncated = assembled.slice(0, 5);
                    btnName.value = truncated;
                }
            };
            key.addEventListener('mousedown', handleKeyClick);
            key.addEventListener('touchstart', handleKeyClick);
        });

        const handleStartClick = (e) => {
            e.preventDefault(); // 기본 터치 이벤트 방지
            btnStart.style.display = 'none';
            btnName.style.display = 'block';
        };

        btnStart.addEventListener('click', handleStartClick);
        btnStart.addEventListener('touchstart', handleStartClick);

        // 표지판 문구 배열
        const phrases = [
            "항공 운송이 배출하는 탄소량!<br>놀랍지 않으세요?",
            "Temu, Aliexpress, Shein과<br>같은 저가 쇼핑 플랫폼은<br>항공 운송을 주로 활용해요",
            "물건이 반품을 위해 왔다 갔다<br>하거나, 그대로 버려진다면",
            "환경에 얼마나 더 큰 영향을<br>줄지 짐작 가시나요?",
            "하지만 우리는 이런 사실을<br>알면서도 충동적으로 물건을<br>구매하곤 해요",
            "기업이 <span style=\"background-color: #A3FF33;\">다크패턴</span>으로 공격적인<br>마케팅을 하기 때문이에요",
            "이런! 또 속도가 빨라졌네요!<br>다크패턴에 유혹 당해서<br>구매하는 것도 과속소비예요",
            "이번에도 저와 함께 퀴즈를<br>맞추면 속도를 줄일 수<br>있어요!",
            "저와 함께 쇼핑몰에서<br>다크패턴을 찾아볼까요?"
        ];
        let currentPhraseIndex = 0;
        let userName = "";

        // 타이핑 효과 상태 변수
        let typingTimeout;
        let isTyping = false;
        let currentFullHTML = "";

        // HTML 태그를 인식하는 타이핑 효과 함수
        function playTypingEffect(element, htmlString, speed = 50) {
            clearTimeout(typingTimeout);
            element.innerHTML = "";
            currentFullHTML = htmlString;
            isTyping = true;
            
            let i = 0;
            let text = "";
            let isTag = false;
            
            function type() {
                if (i < htmlString.length) {
                    let char = htmlString.charAt(i);
                    text += char;
                    
                    if (char === '<') {
                        isTag = true;
                    } else if (char === '>') {
                        isTag = false;
                    }
                    
                    element.innerHTML = text;
                    i++;
                    
                    if (isTag) {
                        type(); // 태그 내부 문자는 딜레이 없이 즉시 출력
                    } else {
                        typingTimeout = setTimeout(type, speed);
                    }
                } else {
                    isTyping = false;
                }
            }
            type();
        }

        const phraseAudioFiles = [
            "sounds/scene2/air_transport_carbon.mp3",
            "sounds/scene2/temu_ali_shein_air_transport.mp3",
            "sounds/scene2/returned_or_thrown_away.mp3",
            "sounds/scene2/environmental_impact_guess.mp3",
            "sounds/scene2/impulsive_buying.mp3",
            "sounds/scene2/dark_pattern_marketing.mp3",
            "sounds/scene2/speed_up_dark_pattern.mp3",
            "sounds/scene2/quiz_slow_down.mp3",
            "sounds/scene2/find_dark_pattern.mp3"
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let sirenBuffer = null;
        let sirenSource = null;
        
        // 사이렌 볼륨 조절을 위한 GainNode 생성
        const sirenGain = audioCtx.createGain();
        sirenGain.gain.value = 0.05; // 1.0이 기본값, 0.05로 볼륨을 훨씬 더 줄임
        sirenGain.connect(audioCtx.destination);

        // Base64 오디오 문자열을 ArrayBuffer로 변환
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64.split(',')[1]);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        let trimStart = 0;
        let trimEnd = 0;

        // siren_b64.js 에서 로드된 SIREN_B64 상수 사용
        audioCtx.decodeAudioData(base64ToArrayBuffer(SIREN_B64))
            .then(buffer => { 
                sirenBuffer = buffer;
                
                // 오디오 파형을 분석하여 앞뒤 무음 구간을 자동으로 찾아냅니다 (MP3 고질적 공백 제거용)
                const channelData = buffer.getChannelData(0);
                const threshold = 0.02; // 무음 판정 기준치 (진폭)
                
                let startSample = 0;
                let endSample = channelData.length - 1;
                
                for (let i = 0; i < channelData.length; i++) {
                    if (Math.abs(channelData[i]) > threshold) { startSample = i; break; }
                }
                for (let i = channelData.length - 1; i >= 0; i--) {
                    if (Math.abs(channelData[i]) > threshold) { endSample = i; break; }
                }
                
                trimStart = startSample / buffer.sampleRate;
                trimEnd = endSample / buffer.sampleRate;
            })
            .catch(e => console.error("사이렌 오디오 디코딩 에러:", e));

        function playSiren() {
            if (!sirenBuffer || sirenSource) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            sirenSource = audioCtx.createBufferSource();
            sirenSource.buffer = sirenBuffer;
            sirenSource.loop = true; 
            
            // 자동으로 분석된 실제 소리 구간만 정확히 반복하도록 설정
            sirenSource.loopStart = trimStart;
            sirenSource.loopEnd = trimEnd;
            
            sirenSource.connect(sirenGain); // destination 대신 gainNode 연결
            sirenSource.start(0, trimStart); // 시작도 소리가 나는 부분부터 즉시 시작
        }

        function stopSiren() {
            if (sirenSource) {
                sirenSource.stop();
                sirenSource.disconnect();
                sirenSource = null;
            }
        }

        let currentPhraseAudio = null;
        function playPhraseAudio(index) {
            if (currentPhraseAudio) {
                currentPhraseAudio.pause();
                currentPhraseAudio.currentTime = 0;
            }
            if (phraseAudioFiles[index]) {
                currentPhraseAudio = new Audio(phraseAudioFiles[index]);
                
                // 대사 텍스트의 실제 글자 수를 바탕으로 예상 타이핑 시간 계산 (글자당 50ms)
                let phraseText = phrases[index].replace('{name}', userName || "");
                let textOnly = phraseText.replace(/<[^>]*>/g, '');
                let expectedTimeMs = textOnly.length * 50; 
                
                // 오디오 길이가 확인되면 타이핑 시간에 맞춰 배속(playbackRate) 자동 조절
                currentPhraseAudio.addEventListener('loadedmetadata', () => {
                    let audioDurationMs = currentPhraseAudio.duration * 1000;
                    let rate = audioDurationMs / expectedTimeMs;
                    
                    // 목소리가 너무 심하게 변조되지 않도록 배속 상하한선 설정 (최대 1.8배속)
                    if (rate > 1.8) rate = 1.8;
                    if (rate < 1.0) rate = 1.0; 
                    
                    currentPhraseAudio.playbackRate = rate;
                });

                currentPhraseAudio.play().catch(e => console.log('Audio play failed:', e));
            }
        }


        const submitName = () => {
            if (btnName.value.trim() === '') return;
            userName = btnName.value.trim();
            
            // 첫 번째 문구 타이핑 효과로 시작
            let newText = phrases[0].replace('{name}', userName);
            playTypingEffect(userNameDisplay, newText);
            playPhraseAudio(0);
            
            hideKeyboard();
            
            // 입력창 숨기고 표지판 및 진행바 표시
            btnName.style.display = 'none';
            signBubble.style.display = 'block';
            progressBar.style.display = 'block';


        };


        // 화면 클릭(터치) 시 상태에 따라 화면 전환 및 문구 넘어가기
        const handleScreenClick = (e) => {
            // 1. 시작 화면 (버튼이 표시된 상태)
            if (btnStart.style.display !== 'none') {
                return; // 화면 클릭으로는 넘어가지 않고 btnStart를 직접 클릭해야 함
            }

            // 2. 이름 입력 화면 (입력창이 표시된 상태)
            if (btnName.style.display === 'block') {
                if (e.target === btnName || mockKeyboard.contains(e.target)) return; // 입력창 자체 터치나 키보드 터치는 무시
                submitName();
                return;
            }

            // 3. 표지판이 화면에 표시된 상태일 때만 대화 진행
            if (signBubble.style.display === 'block') {
                if (isTyping) {
                    // 타이핑 도중 클릭 시 남은 글자 모두 즉시 표시
                    clearTimeout(typingTimeout);
                    userNameDisplay.innerHTML = currentFullHTML;
                    isTyping = false;
                } else {
                    if (currentPhraseIndex < phrases.length - 1) {
                        currentPhraseIndex++;
                        let newText = phrases[currentPhraseIndex].replace('{name}', userName);
                        playTypingEffect(userNameDisplay, newText);
                        playPhraseAudio(currentPhraseIndex);

                        // 비행기 애니메이션은 첫 페이지를 벗어나면 숨김
                        if (currentPhraseIndex > 0) {
                            const airplaneContainer = document.querySelector('.airplane-container');
                            if (airplaneContainer) airplaneContainer.style.display = 'none';
                        }
                        
                        // 두 번째 페이지(currentPhraseIndex === 1)에서만 bg-icon4, bg-icon5 모션 표시
                        const popIconContainer = document.getElementById('popIconContainer');
                        if (popIconContainer) {
                            if (currentPhraseIndex === 1) {
                                popIconContainer.style.display = 'block';
                            } else {
                                popIconContainer.style.display = 'none';
                            }
                        }

                        // 6번째 페이지(currentPhraseIndex === 5)에서만 rect-darkpt 표시
                        const rectDarkpt = document.getElementById('rectDarkpt');
                        if (rectDarkpt) {
                            if (currentPhraseIndex === 5) {
                                rectDarkpt.style.display = 'block';
                            } else {
                                rectDarkpt.style.display = 'none';
                            }
                        }

                        // 표지판 순서에 따른 저구 표정 변경
                        if (currentPhraseIndex === 4) {
                            jeoguSvg1.style.display = 'none';
                            jeoguImg2.style.display = 'block';
                            jeoguImg3.style.display = 'none';
                        } else if (currentPhraseIndex === 5) {
                            jeoguSvg1.style.display = 'none';
                            jeoguImg2.style.display = 'none';
                            jeoguImg3.style.display = 'block';
                        } else {
                            jeoguSvg1.style.display = 'block';
                            jeoguImg2.style.display = 'none';
                            jeoguImg3.style.display = 'none';
                        }

                        // 도로와 구름 가속 (인덱스 4 이상부터)
                        if (currentPhraseIndex >= 4 && currentPhraseIndex <= 8) {
                            roadLineCss.classList.add('fast');
                            cloud1.classList.add('fast');
                            cloud2.classList.add('fast');
                        } else {
                            roadLineCss.classList.remove('fast');
                            cloud1.classList.remove('fast');
                            cloud2.classList.remove('fast');
                        }

                        // 7번째~9번째 화면(인덱스 6, 7, 8)에서 경고 깜빡임 및 사이렌 모션 지속
                        if (currentPhraseIndex >= 6 && currentPhraseIndex <= 8) {
                            warningOverlay.style.display = 'block';
                            siren.style.display = 'block';
                            playSiren();
                        } else {
                            warningOverlay.style.display = 'none';
                            siren.style.display = 'none';
                            stopSiren();
                        }
                    } else if (currentPhraseIndex === phrases.length - 1) {
                        // 마지막 대화 후 클릭 시 전환 애니메이션 실행
                        currentPhraseIndex++; // 중복 실행 방지
                        
                        // 재생 중이던 대화 음성 효과음 정지
                        if (currentPhraseAudio) {
                            currentPhraseAudio.pause();
                            currentPhraseAudio.currentTime = 0;
                        }
                        
                        // 기존 UI 숨기기
                        signBubble.style.display = 'none';
                        progressBar.style.display = 'none';
                        warningOverlay.style.display = 'none';
                        siren.style.display = 'none';

                        stopSiren();

                        // 배경(구름, 도로) 애니메이션 정지
                        roadLineCss.style.animation = 'none';
                        cloud1.style.animation = 'none';
                        cloud2.style.animation = 'none';

                        // 1. 큰 저구 나타나며 줌인 애니메이션 시작
                        jeoguEl.style.display = 'none'; // 작은 저구 숨기기
                        bigJeogu1.style.display = 'block';
                        bigJeogu2.style.display = 'block';
                        bigJeogu2.style.opacity = '0'; // 애니메이션은 같이 진행되도록 초기에 투명하게 설정
                        requestAnimationFrame(() => {
                            bigJeogu1.classList.add('zoom-in-big');
                            bigJeogu2.classList.add('zoom-in-big');
                        });

                        // 2. 줌인이 끝날 무렵(0.6초) 윙크 표정(big-jeogu-2)으로 변경
                        setTimeout(() => {
                            bigJeogu1.style.display = 'none';
                            bigJeogu2.style.opacity = '1';
                        }, 600);

                        // 3. 줌인이 일정 수준 진행된 후(0.8초 뒤) 시계방향 채우기 시작
                        setTimeout(() => {
                            greenWipe.style.display = 'block';
                            greenWipe.classList.add('active');
                        }, 800);

                        // 4. 초록색 채우기 완료 후 최종 퀴즈 문구 화면 표시 (2.3초)
                        setTimeout(() => {
                            quizScreen.classList.add('active');
                            setTimeout(() => {
                                window.location.href = '../quiz2/screen1.html';
                            }, 1500);
                        }, 2300);
                    }
                }
            }
        };

        window.addEventListener('click', handleScreenClick);
        window.addEventListener('touchstart', handleScreenClick);

        // 저구 눈동자가 커서를 따라다니게 하는 로직 (렉 방지 및 최적화)
        const pupils = document.querySelectorAll('.pupil');
        const jeoguEl = document.querySelector('.jeogu');
        
        let jeoguCenterX = window.innerWidth / 2;
        let jeoguCenterY = window.innerHeight / 2;
        let targetMoveX = 0;
        let targetMoveY = 0;
        let currentMoveX = 0;
        let currentMoveY = 0;

        function updateJeoguCenter() {
            const rect = jeoguEl.getBoundingClientRect();
            jeoguCenterX = rect.left + rect.width / 2;
            jeoguCenterY = rect.top + rect.height * 0.3; // 눈이 위쪽에 있으므로 30% 지점
        }

        // 초기 좌표 설정 및 화면 크기 변경 시 재계산 (매 프레임 계산 방지)
        setTimeout(updateJeoguCenter, 100);
        window.addEventListener('resize', updateJeoguCenter);

        window.addEventListener('mousemove', (e) => {
            const dx = e.clientX - jeoguCenterX;
            const dy = e.clientY - jeoguCenterY;
            const angle = Math.atan2(dy, dx);
            
            const maxDistance = 25; 
            const dist = Math.sqrt(dx*dx + dy*dy);
            const moveDist = Math.min(maxDistance, dist / 8);

            targetMoveX = Math.cos(angle) * moveDist;
            targetMoveY = Math.sin(angle) * moveDist;
        });

        // requestAnimationFrame을 사용한 부드러운 눈동자 이동 (Lerp 적용)
        function animateEyes() {
            currentMoveX += (targetMoveX - currentMoveX) * 0.15;
            currentMoveY += (targetMoveY - currentMoveY) * 0.15;

            pupils.forEach(pupil => {
                pupil.style.transform = `translate(${currentMoveX}px, ${currentMoveY}px)`;
            });

            requestAnimationFrame(animateEyes);
        }
        animateEyes();

        // 전역 클릭 효과음 추가
        const clickSound = new Audio('sounds/common/click_sound_1.mp3');
        window.addEventListener('click', (e) => {
            if (jeoguEl.contains(e.target)) return; // 저구 클릭 시 기본 효과음 무시
            clickSound.currentTime = 0; // 연속 클릭 시 처음부터 재생
            clickSound.play().catch(err => console.log('Audio play failed:', err));
        });

        // 저구 터치 효과음 추가
        const jeoguTouchSound = new Audio('sounds/common/jeogu_touch.mp3');
        jeoguTouchSound.volume = 0.2;
        jeoguEl.addEventListener('click', (e) => {
            jeoguTouchSound.currentTime = 0;
            jeoguTouchSound.play().catch(err => console.log('Audio play failed:', err));
        });
        jeoguEl.addEventListener('touchstart', (e) => {
            // e.preventDefault(); // 필요하다면 터치 시 클릭 이벤트 방지
            jeoguTouchSound.currentTime = 0;
            jeoguTouchSound.play().catch(err => console.log('Audio play failed:', err));
        });

        // '만나서 반가워요!' 부분부터 즉시 실행되도록 자동 시작 처리
        window.addEventListener('DOMContentLoaded', () => {
            btnStart.style.display = 'none';
            btnName.style.display = 'none';
            userName = "사용자"; // 임시 이름
            
            let newText = phrases[0].replace('{name}', userName);
            userNameDisplay.innerHTML = newText;
            currentFullHTML = newText; // 클릭 시 다음으로 넘어가도록
            
            signBubble.style.display = 'block';
            progressBar.style.display = 'block';


            
            // 첫 화면 음성은 사용자의 상호작용(터치)이 없으면 브라우저 정책상 자동재생되지 않을 수 있으므로
            // 클릭 시 두 번째 문구로 넘어가면서 자연스럽게 이후 사운드들이 재생되도록 합니다.
        });
    </script>

<!-- GLOBAL BACK BUTTON & POPUP -->
<script>
(function() {
    function initBackBtn() {
        if (document.getElementById('globalBackBtnContainer')) return; // already injected

        const container = document.querySelector('.game-container') || 
                          document.querySelector('.screen-container') || 
                          document.querySelector('#scene') || 
                          document.body;

        const backBtnContainer = document.createElement('div');
        backBtnContainer.id = 'globalBackBtnContainer';
        backBtnContainer.style.cssText = 'position: absolute; top: 40px; left: 40px; z-index: 9999;';
        
        const backBtn = document.createElement('img');
        backBtn.src = '../back_assets/bt-back.svg';
        backBtn.alt = '뒤로가기';
        backBtn.style.cssText = 'width: 131px; height: 132px; cursor: pointer; pointer-events: auto;';
        backBtnContainer.appendChild(backBtn);

        const popupOverlay = document.createElement('div');
        popupOverlay.id = 'globalBackPopup';
        popupOverlay.style.cssText = 'position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; background: rgba(0, 0, 0, 0.6); z-index: 10000; display: none; justify-content: center; align-items: center; pointer-events: auto;';

        const popupContent = document.createElement('div');
        popupContent.style.cssText = 'position: relative; display: flex; justify-content: center; align-items: center;';
        
        const popupBg = document.createElement('img');
        popupBg.src = '../back_assets/view-main.svg';
        popupBg.alt = '메인 팝업';
        popupBg.style.cssText = 'width: 799px; height: 863px;';
        
        const popupButtons = document.createElement('div');
        popupButtons.style.cssText = 'position: absolute; display: flex; flex-direction: column; align-items: center; top: 76%; transform: translateY(-50%);';
        
        const mainBtn = document.createElement('img');
        mainBtn.src = '../back_assets/view-main-bt.svg';
        mainBtn.alt = '메인화면으로';
        mainBtn.style.cssText = 'width: 553px; height: 119px; cursor: pointer; margin-top: -40px; margin-bottom: 60px; pointer-events: auto;';
        
        const closeText = document.createElement('div');
        closeText.textContent = '닫기';
        closeText.style.cssText = 'color: #35D047; font-size: 50px; font-weight: bold; cursor: pointer; text-align: center; padding: 10px; pointer-events: auto;';

        popupButtons.appendChild(mainBtn);
        popupButtons.appendChild(closeText);
        popupContent.appendChild(popupBg);
        popupContent.appendChild(popupButtons);
        popupOverlay.appendChild(popupContent);
        
        container.appendChild(backBtnContainer);
        container.appendChild(popupOverlay);

        const applyFeedback = (el) => {
            el.style.transition = 'transform 0.1s, opacity 0.1s';
            const press = () => { el.style.transform = 'scale(0.90)'; el.style.opacity = '0.6'; };
            const release = () => { el.style.transform = 'scale(1)'; el.style.opacity = '1'; };
            el.addEventListener('touchstart', press, {passive: true});
            el.addEventListener('touchend', release);
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        };
        applyFeedback(backBtn);
        applyFeedback(mainBtn);
        applyFeedback(closeText);

        const handleTouch = (e, callback) => {
            e.preventDefault();
            e.stopPropagation();
            // Restore visual state immediately in case touchend didn't fire due to navigation/display change
            e.currentTarget.style.transform = 'scale(1)';
            e.currentTarget.style.opacity = '1';
            callback();
        };

        const openPopup = () => { 
            if (backBtnContainer.style.display !== 'none') {
                popupOverlay.style.display = 'flex'; 
            }
        };
        const closePopup = () => { popupOverlay.style.display = 'none'; };
        const goMain = () => { 
            localStorage.removeItem('quiz1_solved_answers');
            window.location.href = '../index.html'; 
        };

        backBtn.addEventListener('touchend', (e) => handleTouch(e, openPopup));
        backBtn.addEventListener('click', (e) => handleTouch(e, openPopup));
        
        closeText.addEventListener('touchend', (e) => handleTouch(e, closePopup));
        closeText.addEventListener('click', (e) => handleTouch(e, closePopup));
        
        mainBtn.addEventListener('touchend', (e) => handleTouch(e, goMain));
        mainBtn.addEventListener('click', (e) => handleTouch(e, goMain));

        // --- HIDE CONDITIONS LOGIC ---
        const currentPath = window.location.pathname;
        const isScene1 = currentPath.includes('road/scene1.html');
        const isScene2 = currentPath.includes('road/scene2.html');
        const isQuiz2Screen1 = currentPath.includes('quiz2/screen1.html');

                const updateVisibility = () => {
            let isVisible = true;
            
            if (isScene1) {
                const signBubble = document.getElementById('signBubble');
                const background = document.querySelector('.background');
                const hasStarted = (signBubble && signBubble.style.display === 'block') || 
                                   (background && background.classList.contains('hide-logo'));
                                   
                const bigJeogu1 = document.getElementById('bigJeogu1');
                const bigJeogu2 = document.getElementById('bigJeogu2');
                const quizScreen = document.getElementById('quizScreen');
                const hasEnded = (bigJeogu1 && bigJeogu1.style.display === 'block') || 
                                 (bigJeogu2 && bigJeogu2.style.display === 'block') ||
                                 (quizScreen && quizScreen.classList.contains('active'));
                                 
                if (!hasStarted || hasEnded) {
                    isVisible = false;
                }
            } else if (isScene2) {
                const bigJeogu1 = document.getElementById('bigJeogu1');
                const bigJeogu2 = document.getElementById('bigJeogu2');
                const quizScreen = document.getElementById('quizScreen');
                const hasEnded = (bigJeogu1 && bigJeogu1.style.display === 'block') || 
                                 (bigJeogu2 && bigJeogu2.style.display === 'block') ||
                                 (quizScreen && quizScreen.classList.contains('active'));
                
                if (hasEnded) {
                    isVisible = false;
                }
            } else if (isQuiz2Screen1) {
                const quizCard = document.getElementById('quiz-card');
                if (quizCard && quizCard.style.display === 'block') {
                    isVisible = false;
                }
            }
            
            backBtnContainer.style.display = isVisible ? 'block' : 'none';
        };

        updateVisibility();

        if (isScene1 || isScene2 || isQuiz2Screen1) {
            const observer = new MutationObserver(() => {
                updateVisibility();
            });
            const config = { attributes: true, attributeFilter: ['style', 'class'] };
            
            if (isScene1) {
                const els = [document.getElementById('signBubble'), document.querySelector('.background'), document.getElementById('bigJeogu1'), document.getElementById('bigJeogu2'), document.getElementById('quizScreen')];
                els.forEach(el => { if(el) observer.observe(el, config); });
            } else if (isScene2) {
                const els = [document.getElementById('bigJeogu1'), document.getElementById('bigJeogu2'), document.getElementById('quizScreen')];
                els.forEach(el => { if(el) observer.observe(el, config); });
            } else if (isQuiz2Screen1) {
                const els = [document.getElementById('quiz-card')];
                els.forEach(el => { if(el) observer.observe(el, config); });
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initBackBtn);
    } else {
        initBackBtn();
    }
})();
</script>

</body>
</html>
